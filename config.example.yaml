# Copy this file to `config.local.yaml` (gitignored) and list the target repos
# to scan. These paths live OUTSIDE this git repo, so the harness never touches
# or commits the target source. Each teammate keeps their own config.local.yaml.
#
# Simplest form -- a list of paths (absolute, or relative to this repo root).
# Language and notes are taken from vulnhunt/targets.yaml by folder name when it
# matches; otherwise the language is auto-detected from the files.
repos:
  - "/Users/jll/Documents/Projects/hacking/pizauth"
  - "/Users/jll/Documents/Projects/hacking/snare"
  - "/Users/jll/Documents/Projects/hacking/vibe-kanban"
  - "/Users/jll/Documents/Projects/hacking/Who-Targets-Me"

# You can also give per-repo overrides instead of a bare string:
# repos:
#   - path: "/absolute/path/to/repo-three"
#     name: my-target            # defaults to the folder name
#     language: rust             # or  languages: [rust, ts]
#     notes: "what to focus on"
#
# Alternative (old) style -- a single root folder that contains repos named in
# targets.yaml. Overridden by --repos-root or $VULNHUNT_REPOS_ROOT.
# repos_root: "/absolute/path/to/folder/containing/the/target/repos"
