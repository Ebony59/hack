# Metadata overlay for known targets. The repos to scan are listed in
# config.local.yaml; this file supplies each one's language(s) and notes,
# matched by folder name. Entries here with no matching repo are simply unused,
# and a repo with no entry here gets its language auto-detected.
targets:
  - name: snare
    path: snare
    language: rust
    notes: >
      GitHub webhooks daemon. Authenticates webhook requests (HMAC signature),
      then executes a user-defined per-repo program. Focus: signature verify
      bypass/timing, untrusted payload parsing, command/argument injection.

  - name: pizauth
    path: pizauth
    language: rust
    notes: >
      OAuth2 token requester daemon. Focus: OAuth state/CSRF handling, the
      localhost callback HTTP server, token refresh/storage, config parsing.

  - name: vibe-kanban
    path: vibe-kanban
    languages: [rust, ts]
    notes: >
      Orchestrates coding agents. Large surface. Focus: raw SQL -> SQLi,
      path traversal, command execution of agents, SSRF, API auth gaps.

  - name: who-targets-me
    path: Who-Targets-Me
    language: js
    notes: >
      Browser extension collecting political ads. Focus: content-script XSS,
      message-passing privilege escalation, over-broad permissions, exfil.
